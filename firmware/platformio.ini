; Khung dự án PlatformIO cho nút đo (ESP32).
; Mã nguồn nằm rải trong app/, sensors/, dsp/, comm/ nên src_dir đặt là thư mục này.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<app/>
    +<sensors/>
    +<dsp/>
    +<comm/>
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Môi trường chạy kiểm thử bộ lọc trên máy tính (không cần board).
; Bạn viết test trong test/ rồi chạy: pio test -e native
[env:native]
platform = native
build_src_filter =
    -<*>
    +<dsp/>
